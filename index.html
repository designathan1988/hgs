<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#121418">
  <link rel="icon" href="data:,">
  <title>Human Studio</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><svg viewBox="0 0 24 32" aria-hidden="true"><circle cx="12" cy="4" r="3"/><path d="M8 9h8l3 9-2.2.7-2.4-5.3V21l-1 10h-2.6l-.8-8-.8 8H7.6l-1-10v-7.6l-2.4 5.3L2 18l3-9h3Z"/></svg><span>Human <b>Studio</b></span></div>
      <div class="character"><span id="characterName">Personagem</span><small id="characterMeta"></small></div>
      <div class="spacer"></div>
      <button id="createButton" class="button" type="button">Criar pessoa</button>
      <button id="randomButton" class="button ghost" type="button" title="Gerar uma pessoa aleatória"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 8.5h.01M15.5 8.5h.01M12 12h.01M8.5 15.5h.01M15.5 15.5h.01"/></svg></span>Aleatório</button>
      <div class="menu-anchor">
        <button id="charactersButton" class="button ghost" type="button" title="Salvar e carregar personagens"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="16.5" cy="9" r="2.5"/><path d="M15.5 14.2c2.3-.3 4.3 1.1 5 4.3"/></svg></span>Personagens</button>
        <div id="charactersMenu" class="popover right" hidden></div>
      </div>
      <button id="exportButton" class="button primary" type="button" title="Exportar o personagem em GLB (opções em Exportar)">Exportar GLB</button>
    </header>
    <nav class="rail" aria-label="Seções" id="sectionNav"></nav>
    <main class="viewport" aria-label="Visualização 3D do personagem">
      <canvas id="stage" aria-label="Personagem 3D interativo"></canvas>
      <div class="view-toolbar">
        <div class="segmented compact" id="viewButtons" role="group" aria-label="Câmera"></div>
        <div class="menu-anchor">
          <button id="lightButton" class="icon-button" type="button" title="Iluminação" aria-label="Iluminação"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></span></button>
          <div id="lightMenu" class="popover right" hidden></div>
        </div>
        <button id="screenshotButton" class="icon-button" type="button" title="Salvar captura (PNG)" aria-label="Salvar captura"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3.5L9 5.5h6L16.5 8H20v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></span></button>
        <div class="menu-anchor">
          <button id="crowdButton" class="icon-button" type="button" title="Desempenho e teste de multidão" aria-label="Desempenho"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8" r="2"/><circle cx="17" cy="8" r="2"/><circle cx="12" cy="6" r="2"/><path d="M4 17c.4-2.4 1.5-4 3-4s2.6 1.6 3 4M14 17c.4-2.4 1.5-4 3-4s2.6 1.6 3 4M9 14c.5-2.6 1.6-4 3-4s2.5 1.4 3 4"/></svg></span></button>
          <div id="crowdMenu" class="popover right" hidden></div>
        </div>
      </div>
      <div class="zoom-controls">
        <button id="zoomIn" class="icon-button" type="button" aria-label="Aproximar" title="Aproximar"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
        <button id="zoomOut" class="icon-button" type="button" aria-label="Afastar" title="Afastar"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 12h14"/></svg></span></button>
        <button id="fitButton" class="icon-button" type="button" aria-label="Enquadrar o corpo" title="Enquadrar o corpo"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></span></button>
      </div>
      <p class="viewport-hint" id="viewportHint"></p>
      <div id="errorPanel" class="error-panel" hidden><h2>Não foi possível concluir a operação</h2><p id="errorText"></p><button id="restoreCharacter" class="button" type="button">Manter personagem anterior</button><button id="retryButton" class="button primary" type="button">Tentar de novo</button></div>
    </main>
    <aside class="inspector" aria-labelledby="sectionTitle">
      <div class="inspector-head"><h1 id="sectionTitle">Personagem</h1><div class="head-actions" id="sectionActions"></div></div>
      <div id="inspectorBody" class="inspector-body"></div>
    </aside>
    <footer class="statusbar"><span class="status"><i class="status-dot"></i><span id="readyLabel" role="status" aria-live="polite">Iniciando</span></span><button id="cancelOperation" type="button" class="button" hidden>Cancelar operação</button><span class="spacer"></span><span id="triangles"></span><span id="fps"></span></footer>
  </div>
  <script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
